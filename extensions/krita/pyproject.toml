[project]
name = "krita-mcp"
version = "0.1.0"
description = "MCP front for a running Krita: layers, selections, filters, transforms, native brush strokes, previews Claude can see, and PNG in/out — the canvas where generated images get composed. Only Anthropic's MCP SDK; the HTTP side is stdlib; the in-Krita half is a stdlib-only pykrita plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos Santana", email = "csantanad@gmail.com" }]
dependencies = [
  "mcp>=1.2,<2",   # Anthropic's official MCP Python SDK — same major as the comfy and google extensions
]

[project.scripts]
krita-mcp = "krita_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krita_mcp"]
