[package]
name = "dangler-ytdl"
version = "0.1.0"
edition = "2024"
description = "YouTube archiving MCP server — first-party dangler fleet extension driving a bundled yt-dlp / ffmpeg / deno toolkit for local video, audio and transcript capture"
license = "MIT"
repository = "https://github.com/ophiocus/dangler"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
