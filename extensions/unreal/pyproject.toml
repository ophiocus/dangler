[project]
name = "dangler-unreal"
version = "0.1.0"
description = "Epic's Unreal MCP server (UE 5.8 ModelContextProtocol plugin) as one dangler fleet entry: per-project ports with proved identity, detached editor launch from the pinned engine build, condensed toolset descriptions, serialised calls, a read-only switch. The Epic client is stdlib; the only dependency is Anthropic's MCP SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos Santana", email = "csantanad@gmail.com" }]
dependencies = [
  "mcp>=1.2,<2",   # Anthropic's official MCP Python SDK — same major as the comfy, google and krita extensions
]

[project.scripts]
dangler-unreal = "dangler_unreal.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dangler_unreal"]
