# dangler fleet config — one entry per downstream MCP server.
# Copy to dangler.toml (or point DANGLER_CONFIG at it) and edit.
# NOTE: dangler.toml often ends up carrying credentials (connection strings,
# tokens in env vars) — keep it out of version control.

# Idle reaping: a warm child unused for this many seconds is stopped
# automatically (its cached schemas stay searchable). Default 600; 0 = never.
# Per-server `idle_timeout_secs` overrides the global value.
idle_timeout_secs = 600

[servers.everything]
# The MCP reference test server — handy for smoke-testing dangler itself.
command = "npx"
args = ["-y", "@modelcontextprotocol/server-everything"]
# idle_timeout_secs = 0    # example: keep this one warm forever

[servers.mongodb]
command = "npx"
args = ["-y", "mongodb-mcp-server@latest", "--readOnly"]
[servers.mongodb.env]
MDB_MCP_CONNECTION_STRING = "mongodb+srv://user:pass@cluster.example.mongodb.net/db"

# Windows-without-Node variant: launch a server inside WSL. Env vars only cross
# the wsl.exe boundary if named in WSLENV.
# [servers.mongodb-via-wsl]
# command = "wsl"
# args = ["-d", "Ubuntu-24.04", "--", "bash", "-lc", "npx -y mongodb-mcp-server@latest --readOnly"]
# [servers.mongodb-via-wsl.env]
# MDB_MCP_CONNECTION_STRING = "mongodb+srv://user:pass@cluster.example.mongodb.net/db"
# WSLENV = "MDB_MCP_CONNECTION_STRING"

# Any local MCP server binary works the same way:
# [servers.my-local-server]
# command = "C:/path/to/my-mcp-server.exe"
# args = ["--flag"]
# cwd = "C:/path/to"

# First-party extension: the GoDaddy server (extensions/godaddy in this repo).
# Build with `cargo build --release --workspace`, then point at the binary.
# Credentials stay OUT of this file: point GODADDY_CREDENTIALS_FILE at a file
# with a PAT=... line (preferred) or KEY=/SECRET= lines (legacy sso-key).
# See extensions/godaddy/README.md.
# [servers.godaddy]
# command = "C:/path/to/dangler/target/release/dangler-godaddy.exe"
# identity = "personal GoDaddy account"
# setup_hint = "create a Personal Access Token at developer.godaddy.com and write PAT=... into the file GODADDY_CREDENTIALS_FILE points at"
# [servers.godaddy.env]
# GODADDY_CREDENTIALS_FILE = "C:/Users/me/.godaddy/credentials"
# # GODADDY_ENV = "ote"        # test environment instead of production
# # GODADDY_READ_ONLY = "1"    # refuse every mutating tool

# First-party extension: Google Workspace (extensions/google in this repo).
# Python rather than Rust, so it is run through uv rather than a built binary.
# Secrets stay in ~/.gcp: the OAuth desktop client and the per-machine token.
# Run `uv run --directory <repo>/extensions/google gws-mcp auth` once per
# machine before first use. See extensions/google/README.md.
# [servers.google]
# command = "uv"
# args = ["run", "--directory", "C:/path/to/dangler/extensions/google", "gws-mcp"]
# identity = "your Google account (Docs + Sheets read/write, Drive read-only)"
# setup_hint = "put an OAuth desktop client at ~/.gcp/client_secret.json, then run `uv run --directory <repo>/extensions/google gws-mcp auth` and approve in the browser"

# First-party extension: local YouTube archiving (extensions/ytdl in this repo).
# The binary carries no toolchain — YTDL_HOME points at the directory holding
# bin/yt-dlp.exe, bin/deno.exe, bin/ffmpeg.exe and scripts/.
# See extensions/ytdl/README.md.
# [servers.ytdl]
# command = "C:/path/to/dangler/target/release/dangler-ytdl.exe"
# identity = "local personal archiving"
# setup_hint = "point YTDL_HOME at the ytdownloader toolkit directory; capture a browser session with bin\\ytlogin.cmd anon if YouTube starts refusing anonymous extraction"
# [servers.ytdl.env]
# YTDL_HOME = "C:/path/to/ytdownloader"
# # YTDL_DOWNLOADS = "D:/archive"   # default: <YTDL_HOME>/downloads
# # YTDL_TIMEOUT_SECS = "1800"      # default 900; raise for long videos
# # YTDL_READ_ONLY = "1"            # refuse every tool that writes to disk
